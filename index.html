<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DusiTool - Trích Xuất Token HAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: #020205; 
            color: #e2e8f0; 
            overflow: hidden;
        }
        
        .cyber-grid {
            position: absolute; inset: 0; z-index: -1; pointer-events: none;
            background-image: linear-gradient(rgba(14, 165, 233, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(14, 165, 233, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(1000px) rotateX(45deg) translateY(-50px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 30px; } }

        .glass-panel { 
            background: linear-gradient(145deg, rgba(10, 15, 28, 0.9), rgba(5, 8, 16, 0.95));
            border: 1px solid rgba(14, 165, 233, 0.3); 
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        
        .text-glow-cyan { text-shadow: 0 0 10px rgba(14, 165, 233, 0.6); }

        /* Nút Upload */
        .upload-box {
            border: 2px dashed rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
        }
        .upload-box:hover {
            background: rgba(14, 165, 233, 0.05);
            border-color: rgba(14, 165, 233, 0.8);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.15);
        }

        /* Modal Animation */
        #tokenModal { backdrop-filter: blur(5px); }
        .modal-content { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        /* Chuyển hướng Animation */
        @keyframes fastLoading { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <div class="cyber-grid"></div>

    <!-- Màn hình chính -->
    <div class="glass-panel w-full max-w-sm rounded-3xl p-8 relative z-10">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-sky-500 to-fuchsia-500"></div>

        <div class="text-center mb-6">
            <i class="ph-duotone ph-file-code text-5xl text-sky-400 text-glow-cyan mb-2 inline-block"></i>
            <h1 class="text-xl font-bold text-white tracking-wide">DUSI HAR EXTRACTOR</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase">Trích xuất Offline - Bảo mật 100%</p>
        </div>

        <label for="harInput" class="upload-box rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer group">
            <i class="ph-duotone ph-upload-simple text-4xl text-sky-400 mb-3 group-hover:-translate-y-1 transition-transform"></i>
            <span class="font-bold text-white text-sm">CHỌN FILE HAR</span>
            <span class="text-xs text-slate-500 mt-1">Hỗ trợ iOS / Android / PC</span>
            <!-- Xóa accept để iOS nhận -->
            <input type="file" id="harInput" class="hidden" onclick="this.value=null"> 
        </label>
    </div>

    <!-- Popup Modal (Hiện Token) -->
    <div id="tokenModal" class="fixed inset-0 z-40 bg-black/80 flex items-center justify-center opacity-0 invisible transition-all duration-300 px-4">
        <div class="glass-panel modal-content p-6 w-full max-w-sm rounded-2xl text-center scale-90 opacity-0 relative" id="modalBox">
            <!-- Nút Đóng -->
            <button id="btnCloseModal" class="absolute top-3 right-3 text-slate-400 hover:text-white transition-colors">
                <i class="ph-bold ph-x text-lg"></i>
            </button>

            <i class="ph-fill ph-check-circle text-5xl text-emerald-400 mb-3 drop-shadow-[0_0_10px_rgba(16,185,129,0.5)] inline-block"></i>
            <h2 class="text-lg font-bold text-white mb-4 tracking-wide uppercase">Lấy Token Thành Công</h2>
            
            <div class="relative mb-5">
                <textarea id="tokenOutput" rows="3" class="w-full bg-slate-900/80 border border-emerald-500/30 rounded-xl p-3 text-xs font-mono text-emerald-300 break-all resize-none focus:outline-none" readonly></textarea>
            </div>

            <button id="btnCopyModal" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white text-sm font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.3)] transition-all flex items-center justify-center gap-2 uppercase tracking-wide">
                <i class="ph-bold ph-copy text-lg"></i> COPY & QUAY VỀ WEB
            </button>
        </div>
    </div>

    <!-- Màn hình chuyển hướng -->
    <div id="redirectOverlay" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center opacity-0 invisible transition-all duration-300">
        <i class="ph-fill ph-check-circle text-7xl text-emerald-400 mb-4 scale-90 transition-transform duration-300" id="redirectIcon"></i>
        <h2 class="text-2xl font-bold text-white mb-2 uppercase tracking-wide">Đã lưu vào bộ nhớ!</h2>
        <p class="text-sky-400 text-sm">Đang chuyển về trang chủ...</p>
        
        <div class="w-48 h-1 bg-slate-800 rounded-full mt-6 overflow-hidden">
            <div class="h-full bg-emerald-400 animate-[fastLoading_1.5s_linear_forwards]"></div>
        </div>
    </div>

    <script>
        const harInput = document.getElementById('harInput');
        const tokenModal = document.getElementById('tokenModal');
        const modalBox = document.getElementById('modalBox');
        const tokenOutput = document.getElementById('tokenOutput');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const btnCopyModal = document.getElementById('btnCopyModal');
        const redirectOverlay = document.getElementById('redirectOverlay');
        const redirectIcon = document.getElementById('redirectIcon');

        // Hiện modal
        function showModal(token) {
            tokenOutput.value = token;
            tokenModal.classList.remove('opacity-0', 'invisible');
            setTimeout(() => {
                modalBox.classList.remove('scale-90', 'opacity-0');
                modalBox.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // Ẩn modal
        function hideModal() {
            modalBox.classList.remove('scale-100', 'opacity-100');
            modalBox.classList.add('scale-90', 'opacity-0');
            setTimeout(() => {
                tokenModal.classList.add('opacity-0', 'invisible');
            }, 300);
        }

        btnCloseModal.addEventListener('click', hideModal);

        // Đọc file HAR
        harInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const content = event.target.result;
                let token = null;

                const match1 = content.match(/"name"\s*:\s*"msdk-itopencodeparam"\s*,\s*"value"\s*:\s*"([A-Fa-f0-9]+)"/i);
                if (match1) {
                    token = match1[1];
                } else {
                    const match2 = content.match(/itopencodeparam=([A-Fa-f0-9]{100,})/i);
                    if (match2) token = match2[1];
                }

                if (token) {
                    showModal(token);
                } else {
                    alert("Không tìm thấy Auth Token trong file này! Vui lòng kiểm tra lại file HAR.");
                }
            };

            reader.onerror = function() {
                alert("Lỗi không thể đọc file!");
            };

            reader.readAsText(file);
        });

        // Copy và chuyển hướng
        btnCopyModal.addEventListener('click', () => {
            tokenOutput.select();
            document.execCommand('copy');
            
            // Ẩn modal, hiện màn hình redirect
            hideModal();
            setTimeout(() => {
                redirectOverlay.classList.remove('opacity-0', 'invisible');
                setTimeout(() => redirectIcon.classList.remove('scale-90'), 50);
                
                // Bay về web sau 1.5s
                setTimeout(() => {
                    window.location.href = 'https://dusi.online/';
                }, 1500);
            }, 300);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trích xuất Token từ HAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(14, 165, 233, 0.3); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-lg rounded-2xl p-6 shadow-2xl">
        <div class="text-center mb-6">
            <i class="ph-duotone ph-file-code text-5xl text-sky-400 mb-2"></i>
            <h1 class="text-2xl font-bold text-white">Lấy Auth Token từ HAR</h1>
            <p class="text-sm text-slate-400 mt-1">Xử lý 100% offline, không gửi dữ liệu đi đâu.</p>
        </div>

        <!-- Khung Upload -->
        <label for="harInput" class="border-2 border-dashed border-sky-500/50 rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer hover:bg-sky-900/20 transition-colors mb-6">
            <i class="ph-duotone ph-upload-simple text-3xl text-sky-400 mb-2"></i>
            <span class="font-medium text-slate-300">Bấm để chọn file .har</span>
            <input type="file" id="harInput" accept=".har,application/json,text/plain" class="hidden">
        </label>

        <!-- Trạng thái file -->
        <div id="fileStatus" class="text-center text-sm font-medium mb-4 hidden"></div>

        <!-- Khung kết quả -->
        <div id="resultArea" class="hidden">
            <label class="block text-xs font-semibold text-sky-400 uppercase tracking-wider mb-2">Token trích xuất được:</label>
            <div class="relative">
                <textarea id="tokenOutput" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-green-400 break-all resize-none focus:outline-none" readonly></textarea>
                <button id="btnCopy" class="absolute bottom-3 right-3 bg-sky-500 hover:bg-sky-400 text-white text-xs font-bold py-1.5 px-3 rounded shadow transition-colors flex items-center gap-1">
                    <i class="ph-bold ph-copy"></i> COPY
                </button>
            </div>
        </div>
    </div>

    <script>
        const harInput = document.getElementById('harInput');
        const fileStatus = document.getElementById('fileStatus');
        const resultArea = document.getElementById('resultArea');
        const tokenOutput = document.getElementById('tokenOutput');
        const btnCopy = document.getElementById('btnCopy');

        harInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileStatus.classList.remove('hidden');
            fileStatus.innerHTML = `<span class="text-yellow-400">Đang đọc file: ${file.name}...</span>`;
            resultArea.classList.add('hidden');

            const reader = new FileReader();
            reader.onload = function(event) {
                const content = event.target.result;
                let token = null;

                // Regex 1: Tìm theo header msdk-itopencodeparam
                const match1 = content.match(/"name"\s*:\s*"msdk-itopencodeparam"\s*,\s*"value"\s*:\s*"([A-Fa-f0-9]+)"/i);
                if (match1) {
                    token = match1[1];
                } else {
                    // Regex 2: Tìm chuỗi hex dài đặc trưng
                    const match2 = content.match(/itopencodeparam=([A-Fa-f0-9]{100,})/i);
                    if (match2) token = match2[1];
                }

                if (token) {
                    fileStatus.innerHTML = `<span class="text-green-400"><i class="ph-fill ph-check-circle"></i> Đã tìm thấy Token!</span>`;
                    tokenOutput.value = token;
                    resultArea.classList.remove('hidden');
                } else {
                    fileStatus.innerHTML = `<span class="text-red-400"><i class="ph-fill ph-warning-circle"></i> Không tìm thấy Auth Token trong file này.</span>`;
                }
            };

            reader.onerror = function() {
                fileStatus.innerHTML = `<span class="text-red-400">Lỗi không thể đọc file!</span>`;
            };

            reader.readAsText(file);
        });

        btnCopy.addEventListener('click', () => {
            tokenOutput.select();
            document.execCommand('copy'); // Dùng lệnh cũ cho chắc ăn khi chạy local
            
            const originalText = btnCopy.innerHTML;
            btnCopy.innerHTML = `<i class="ph-bold ph-check"></i> ĐÃ COPY`;
            btnCopy.classList.replace('bg-sky-500', 'bg-green-500');
            btnCopy.classList.replace('hover:bg-sky-400', 'hover:bg-green-400');
            
            setTimeout(() => {
                btnCopy.innerHTML = originalText;
                btnCopy.classList.replace('bg-green-500', 'bg-sky-500');
                btnCopy.classList.replace('hover:bg-green-400', 'hover:bg-sky-400');
            }, 2000);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DusiTool - Trích Xuất Token HAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: #020205; 
            color: #e2e8f0; 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(217, 70, 239, 0.08), transparent 25%);
        }
        .glass-panel { 
            background: linear-gradient(145deg, rgba(10, 15, 28, 0.8), rgba(5, 8, 16, 0.9));
            border: 1px solid rgba(14, 165, 233, 0.4); 
            backdrop-filter: blur(16px);
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.15), inset 0 0 20px rgba(14, 165, 233, 0.05);
        }
        .text-glow-cyan { text-shadow: 0 0 15px rgba(14, 165, 233, 0.6); }
        .text-glow-magenta { text-shadow: 0 0 15px rgba(217, 70, 239, 0.6); }
        .pulse-border { animation: pulseBorder 2s infinite; }
        @keyframes pulseBorder {
            0% { border-color: rgba(14, 165, 233, 0.3); }
            50% { border-color: rgba(14, 165, 233, 0.8); box-shadow: 0 0 15px rgba(14, 165, 233, 0.2); }
            100% { border-color: rgba(14, 165, 233, 0.3); }
        }
        /* Notification overlay */
        #redirectOverlay { transition: opacity 0.4s ease, visibility 0.4s ease; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Lưới background -->
    <div class="absolute inset-0 pointer-events-none" style="background-image: linear-gradient(rgba(14, 165, 233, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(14, 165, 233, 0.03) 1px, transparent 1px); background-size: 30px 30px; z-index: -1;"></div>

    <div class="glass-panel w-full max-w-md rounded-3xl p-8 relative overflow-hidden">
        <!-- Decoration lines -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-sky-500 via-fuchsia-500 to-sky-500"></div>

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-sky-500/10 border border-sky-500/30 mb-4">
                <i class="ph-duotone ph-file-code text-4xl text-sky-400 text-glow-cyan"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">DUSI <span class="text-fuchsia-400 text-glow-magenta">HAR</span> EXTRACTOR</h1>
            <p class="text-xs font-semibold text-slate-400 mt-2 tracking-wider uppercase">Hỗ trợ trích xuất Token 100% Offline</p>
        </div>

        <!-- Khung Upload (Đã xóa accept để iOS chọn được) -->
        <label for="harInput" class="pulse-border border-2 border-dashed rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer hover:bg-sky-400/5 transition-all duration-300 mb-6 group">
            <i class="ph-duotone ph-cloud-arrow-up text-4xl text-sky-400 mb-3 group-hover:scale-110 transition-transform duration-300"></i>
            <span class="font-bold text-slate-200 text-sm">CHẠM ĐỂ CHỌN FILE HAR</span>
            <span class="text-xs text-slate-500 mt-1">Dữ liệu an toàn, không tải lên mạng</span>
            <input type="file" id="harInput" class="hidden">
        </label>

        <!-- Trạng thái file -->
        <div id="fileStatus" class="text-center text-sm font-bold mb-4 hidden rounded-xl py-3 bg-slate-900/50 border border-slate-700"></div>

        <!-- Khung kết quả -->
        <div id="resultArea" class="hidden animate-[fadeIn_0.5s_ease-out]">
            <label class="block text-xs font-bold text-sky-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                <i class="ph-bold ph-key"></i> TOKEN CỦA BẠN:
            </label>
            <div class="relative">
                <textarea id="tokenOutput" rows="4" class="w-full bg-[#060913] border border-sky-500/30 rounded-xl p-4 text-sm font-medium text-emerald-400 break-all resize-none focus:outline-none focus:border-sky-500 transition-colors shadow-inner" readonly></textarea>
                
                <button id="btnCopy" class="absolute bottom-4 right-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white text-xs font-bold py-2 px-4 rounded-lg shadow-[0_0_15px_rgba(14,165,233,0.4)] transition-all flex items-center gap-2 uppercase tracking-wide">
                    <i class="ph-bold ph-copy text-lg"></i> Bấm Copy
                </button>
            </div>
        </div>
    </div>

    <!-- Thông báo chuyển hướng -->
    <div id="redirectOverlay" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center opacity-0 invisible">
        <i class="ph-fill ph-check-circle text-7xl text-emerald-400 mb-4 animate-bounce"></i>
        <h2 class="text-3xl font-bold text-white mb-2">ĐÃ COPY TOKEN!</h2>
        <p class="text-sky-400 font-medium text-lg">Đang đưa bạn về <span class="font-bold text-white">dusi.online</span>...</p>
        
        <!-- Loading bar -->
        <div class="w-64 h-2 bg-slate-800 rounded-full mt-6 overflow-hidden">
            <div class="h-full bg-gradient-to-r from-sky-400 to-fuchsia-500 animate-[loading_2.5s_ease-in-out_forwards]"></div>
        </div>
    </div>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes loading { 0% { width: 0%; } 100% { width: 100%; } }
    </style>

    <script>
        const harInput = document.getElementById('harInput');
        const fileStatus = document.getElementById('fileStatus');
        const resultArea = document.getElementById('resultArea');
        const tokenOutput = document.getElementById('tokenOutput');
        const btnCopy = document.getElementById('btnCopy');
        const redirectOverlay = document.getElementById('redirectOverlay');

        harInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileStatus.classList.remove('hidden');
            fileStatus.innerHTML = `<span class="text-amber-400 flex items-center justify-center gap-2"><i class="ph-duotone ph-spinner animate-spin text-lg"></i> Đang đọc file: ${file.name}...</span>`;
            resultArea.classList.add('hidden');

            const reader = new FileReader();
            reader.onload = function(event) {
                const content = event.target.result;
                let token = null;

                // Regex quét token
                const match1 = content.match(/"name"\s*:\s*"msdk-itopencodeparam"\s*,\s*"value"\s*:\s*"([A-Fa-f0-9]+)"/i);
                if (match1) {
                    token = match1[1];
                } else {
                    const match2 = content.match(/itopencodeparam=([A-Fa-f0-9]{100,})/i);
                    if (match2) token = match2[1];
                }

                if (token) {
                    fileStatus.innerHTML = `<span class="text-emerald-400 flex items-center justify-center gap-2"><i class="ph-fill ph-check-circle text-lg"></i> Phân tích thành công!</span>`;
                    tokenOutput.value = token;
                    resultArea.classList.remove('hidden');
                } else {
                    fileStatus.innerHTML = `<span class="text-rose-400 flex items-center justify-center gap-2"><i class="ph-fill ph-warning-circle text-lg"></i> Không tìm thấy Token trong file này.</span>`;
                }
            };

            reader.onerror = function() {
                fileStatus.innerHTML = `<span class="text-rose-400 flex items-center justify-center gap-2"><i class="ph-fill ph-x-circle text-lg"></i> Lỗi không thể đọc file!</span>`;
            };

            reader.readAsText(file);
        });

        btnCopy.addEventListener('click', () => {
            // Copy token
            tokenOutput.select();
            document.execCommand('copy');
            
            // Hiện màn hình chuyển hướng
            redirectOverlay.classList.remove('opacity-0', 'invisible');
            
            // Chuyển hướng sau 2.5 giây
            setTimeout(() => {
                window.location.href = 'https://dusi.online/';
            }, 2500);
        });
    </script>
</body>
</html>
